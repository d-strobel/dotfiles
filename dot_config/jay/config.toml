# Jay Wayland Compositor configuration
#
# More information:
# https://mahkoh.github.io/jay/book/introduction.html

# Disable conig watcher
auto-reload = false

# Appearance
workspace-display-order = "sorted"
show-titles = true

# Misc
focus-follows-mouse = false

# German keymap, no caps-lock
keymap.rmlvo = {
  layout = "de",
  options = "ctrl:nocaps",
}

# Exec-once before desktop is started
on-startup = {
  type = "set-env",
  env = { XDG_CURRENT_DESKTOP = "jay" },
}

# Exec-once after desktop is started
on-graphics-initialized = [
    { type = "exec", exec = "wl-tray-bridge" },
    { type = "exec", exec = "nm-applet" },
    { type = "exec", exec = "blueman-applet" },
    { type = "exec", exec = ["foot", "--server"] },
]

# Idle settings
idle = {
    minutes = 30,
    grace-period = { seconds = 15 },
}
on-idle = {
    type = "exec",
    exec = {
        prog = "swaylock",
        privileged = true,
    },
}

# Disable sessions
[session-management]
enabled = false

# Configure keyboards
[[inputs]]
match.is-keyboard = true
repeat-rate = { rate = 25, delay = 400 }

# Configure touchpads
[[inputs]]
match.is-pointer = true
tap-enabled = true
tap-drag-enabled = true
tap-drag-lock-enabled = false
click-method = "clickfinger"
natural-scrolling = true

# Configure lidswitch
[[inputs]]
match.is-switch = true
on-lid-closed = {
    type = "configure-connector",
    connector = {
        match.name = "eDP-1",
        enabled = false,
    },
}
on-lid-opened = {
    type = "configure-connector",
    connector = {
        match.name = "eDP-1",
        enabled = true,
    },
}

# Global shortcuts
[shortcuts]
# Focus windows
logo-h = "focus-left"
logo-j = "focus-down"
logo-k = "focus-up"
logo-l = "focus-right"

# Move windows
logo-shift-h = "move-left"
logo-shift-j = "move-down"
logo-shift-k = "move-up"
logo-shift-l = "move-right"

# Direct launch
logo-Return = { type = "exec", exec = "footclient" }
logo-space = { type = "exec", exec = "fuzzel" }

# Misc
logo-t = "toggle-split"
logo-m = "toggle-mono"
logo-c = "open-control-center"
logo-shift-f = "toggle-fullscreen"
logo-shift-r = "reload-config-toml"
logo-shift-q = "close"
logo-shift-alt-m = "quit"

# Switch to TTY
ctrl-alt-F1 = { type = "switch-to-vt", num = 1 }
ctrl-alt-F2 = { type = "switch-to-vt", num = 2 }
ctrl-alt-F3 = { type = "switch-to-vt", num = 3 }
ctrl-alt-F4 = { type = "switch-to-vt", num = 4 }
ctrl-alt-F5 = { type = "switch-to-vt", num = 5 }
ctrl-alt-F6 = { type = "switch-to-vt", num = 6 }
ctrl-alt-F7 = { type = "switch-to-vt", num = 7 }
ctrl-alt-F8 = { type = "switch-to-vt", num = 8 }
ctrl-alt-F9 = { type = "switch-to-vt", num = 9 }
ctrl-alt-F10 = { type = "switch-to-vt", num = 10 }

# Go to workspace
logo-1 = { type = "show-workspace", name = "1" }
logo-2 = { type = "show-workspace", name = "2" }
logo-3 = { type = "show-workspace", name = "3" }
logo-4 = { type = "show-workspace", name = "4" }
logo-5 = { type = "show-workspace", name = "5" }
logo-6 = { type = "show-workspace", name = "6" }
logo-7 = { type = "show-workspace", name = "7" }
logo-8 = { type = "show-workspace", name = "8" }
logo-9 = { type = "show-workspace", name = "9" }
logo-0 = { type = "show-workspace", name = "10" }

# Move app to workspace
logo-shift-1 = { type = "move-to-workspace", name = "1" }
logo-shift-2 = { type = "move-to-workspace", name = "2" }
logo-shift-3 = { type = "move-to-workspace", name = "3" }
logo-shift-4 = { type = "move-to-workspace", name = "4" }
logo-shift-5 = { type = "move-to-workspace", name = "5" }
logo-shift-6 = { type = "move-to-workspace", name = "6" }
logo-shift-7 = { type = "move-to-workspace", name = "7" }
logo-shift-8 = { type = "move-to-workspace", name = "8" }
logo-shift-9 = { type = "move-to-workspace", name = "9" }
logo-shift-0 = { type = "move-to-workspace", name = "10" }

# Fn key binds for display brightness
XF86MonBrightnessUp = {
    type = "exec",
    exec = ["brightnessctl-notify.sh", "up", "5"],
}
XF86MonBrightnessDown = {
    type = "exec",
    exec = ["brightnessctl-notify.sh", "down", "5"],
}

# Fn key binds for audio control
XF86AudioRaiseVolume = {
    type = "exec",
    exec = ["wpctl-notify.sh", "up", "5"],
}
XF86AudioLowerVolume = {
    type = "exec",
    exec = ["wpctl-notify.sh", "down", "5"],
}
XF86AudioMute = {
    type = "exec",
    exec = ["wpctl-notify.sh", "mute" ],
}
XF86AudioMicMute = {
    type = "exec",
    exec = ["wpctl", "set-mute", "@DEFAULT_AUDIO_SOURCE@", "toggle"],
}

# Screenshot binds
logo-shift-p = {
    type = "exec",
    exec = {
      shell = "grim -g $(slurp) - | wl-copy && notify-send --app-name slurp \"Slurp\" \"Screenshot copied to clipboard.\"",
      privileged = true,
    }
}
logo-Print = {
    type = "exec",
    exec = {
      shell = "grim -g $(slurp) - | wl-copy && notify-send --app-name slurp \"Slurp\" \"Screenshot copied to clipboard.\"",
      privileged = true,
    }
}
logo-shift-Print = {
    type = "exec",
    exec = {
      shell = "grim -g \"$(slurp)\" -t ppm - | satty --filename - --fullscreen --output-filename \"$HOME/Pictures/Screenshots/$(date '+%Y%m%d-%H:%M:%S').png\"",
      privileged = true,
    }
}

# Screenlock
logo-shift-Return = {
    type = "exec",
    exec = {
        prog = "swaylock",
        privileged = true,
    },
}

[theme]
border-width = 2
bar-height = 24
title-height = 24
container-borders = "separators"
show-window-icons = false

# Colors
captured-focused-title-bg-color = "#900000"
captured-unfocused-title-bg-color = "#5f0000"

# Fonts
font = "JetBrainsMono Nerd Font 11"
title-font = "JetBrainsMono Nerd Font 11"
bar-font = "JetBrainsMono Nerd Font 11"

# Define the status bar
[status]
format = "i3bar"
i3bar-separator = ""
exec = ["i3status-rs", "/home/dstrobel/.config/i3status-rs/config.toml" ]

# Disable XWayland
[xwayland]
enabled = false

# Privileged clients
[[clients]]
match.any = [
    { comm = "wl-copy" },
    { comm = "wl-paste" },
]
capabilities = ["data-control"]

# Window rules
[[windows]]
match.app-id = "org.pulseaudio.pavucontrol"
initial-tile-state = "floating"

[[windows]]
match.title = "Picture in picture"
initial-tile-state = "floating"
auto-focus = false

[[windows]]
match.title-regex = 'is sharing (your screen|a window)\.$'
initial-tile-state = "floating"
auto-focus = false
action = { type = "move-to-workspace", name = "_" }
