icons_format = "{icon}"

[theme]
theme = "plain"

[icons]
icons = "awesome4"
[icons.overrides]
cpu = ""
memory_mem = ""

[[block]]
block = "privacy"
[[block.driver]]
name = "pipewire"

[[block]]
block = "sound"
driver = "pipewire"
device_kind = "sink"

[[block]]
block = "sound"
driver = "pipewire"
device_kind = "source"

[[block]]
block = "cpu"
format = " $icon $utilization "
info_cpu = 20
warning_cpu = 70
critical_cpu = 90

[[block]]
block = "memory"
format = " $icon $mem_total_used_percents.eng(w:2) "
format_alt = " $icon_swap $swap_used_percents.eng(w:2) "

[[block]]
block = "battery"
format = " $icon $percentage "

[[block]]
block = "time"
interval = 5
format = " $timestamp.datetime(f:'%a %d.%m.%y %R') "
